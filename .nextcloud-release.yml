schema: 1
repository: LibreCodeCoop/extract

app:
  id: extract
  main_branch: main

branches:
  stable_pattern: '^stable(?<nextcloud>\d+)$'

version:
  source: appinfo/info.xml
  mirrors:
    - package.json
    - package-lock.json
  tag_prefix: v

history:
  previous_release: reachable-tag
  initial_ref: b1252308a867580bdef509b4418b66de17352e25

changelog:
  strategy: per-major
  path: 'docs/changelogs/changelog-{major}.md'
  package_root: CHANGELOG.md

milestones:
  patch: 'Next Patch ({nextcloud})'
  rc: 'Next RC ({nextcloud})'

authorization:
  prepare_min_permission: maintain
  merge_min_permission: maintain

package:
  command:
    - make
    - appstore
    - verify-appstore-package
  required_paths:
    - appinfo
    - lib
    - css
    - js
    - img
    - l10n
    - COPYING
  forbidden_paths:
    - .git
    - .github
    - build
    - node_modules
    - src
    - tests
    - vendor
    - vendor-bin
    - docs
    - playwright-report
    - test-results

publication:
  publisher_workflow: appstore-build-publish.yml
  asset_name: '{app}-{tag}.tar.gz'
  appstore_api: https://apps.nextcloud.com/api/v1/platform/{nextcloud}.0.0/apps.json
