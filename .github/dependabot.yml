#
# Dependabot configuration.
#
# The `ignore` entries below cover two advisories that cannot be fixed from this
# repository. Dependabot's update job fails when it cannot produce a security
# update, so leaving them enabled turns every run red:
#
#   undici 6.29.0  - reached only through semantic-release -> @semantic-release/npm
#                    -> npm -> node-gyp. npm vendors this dependency inside its own
#                    tarball (inBundle: true), so neither an `overrides` entry nor a
#                    lockfile edit reaches it; `npm ci` restores 6.29.0. npm 11.21.1
#                    and 12.2.1 both still bundle 6.29.0, so there is no release to
#                    move to. Dependabot reports: "Security update not possible for
#                    undici ... latest possible version is 6.29.0".
#
#   elliptic 6.6.1 - dev-only, via @nextcloud/vite-config -> node-stdlib-browser.
#                    6.6.1 is the latest published version, so no fix exists.
#                    Dependabot reports: "Security update not found for elliptic ...
#                    dependency is up to date but still vulnerable".
#
# Revisit both when npm ships a patched undici, or when a patched elliptic is
# published. The corresponding Dependabot alerts stay open as a reminder.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm_and_yarn:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # The range must cover the version Dependabot would try to move to, not
      # just the vulnerable one: `ignore.versions` matches the *target* version,
      # so "<6.29.1" would still attempt 6.29.1 and leave the job red. 6.29.1 is
      # the earliest patched release and is unreachable here, so it is included.
      - dependency-name: undici
        versions:
          - "<=6.29.1"
      # 6.6.1 is the newest published version, so no fix exists yet. Scoped to
      # this version range rather than the package, so a future patched release
      # is still picked up automatically.
      - dependency-name: elliptic
        versions:
          - "<=6.6.1"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
