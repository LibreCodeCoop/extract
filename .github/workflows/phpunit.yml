name: PHPUnit

on: pull_request

permissions:
  contents: read

concurrency:
  group: phpunit-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  phpunit:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-versions: ['8.3', '8.4', '8.5']

    name: php${{ matrix.php-versions }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up php ${{ matrix.php-versions }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: bz2, ctype, curl, dom, fileinfo, iconv, json, libxml, mbstring, openssl, session, simplexml, xmlreader, xmlwriter, zip, zlib
          coverage: none
          ini-file: development
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Install straight from composer.lock. It pins nextcloud/ocp to an exact
      # commit, so the suite is reproducible and cannot break when upstream
      # moves. No --ignore-platform-reqs, so a real PHP conflict still fails.
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Install archive backends needed by tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full zstd

      - name: Run unit tests
        run: composer run test:unit -- --no-progress

  summary:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: phpunit

    if: always()

    name: phpunit-summary

    steps:
      - name: Summary status
        run: if ${{ needs.phpunit.result != 'success' && needs.phpunit.result != 'skipped' }}; then exit 1; fi
